<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Completado</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            font-family: sans-serif;
        }

        .modal-exito {
            background-color: #2b3346;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            text-align: center;
        }

        .icono-check {
            background-color: #f1ff00;
            color: #121212;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h2 {
            margin: 0 0 12px 0;
            color: white;
            font-size: 22px;
            font-weight: 600;
        }

        p {
            margin: 0;
            color: #d1d5db;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="modal-exito">
        <div class="icono-check">✓</div>
        <h2>Pago Exitoso!!!</h2>
        <p>Desbloqueaste las funciones PRO</p>
    </div>

</body>
</html>
